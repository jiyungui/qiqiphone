<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>祁祁phone</title>
  
  <!-- PWA & 移动端全屏桌面安装支持 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F1F2F1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="祁祁phone">
  <link rel="apple-touch-icon" href="assets/icons/phone-icon.svg">
  
  <!-- 模块化样式表 -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/widgets.css">
</head>
<body>

  <div id="phone-viewport">
    
    <!-- 顶部极简状态栏 -->
    <header class="status-bar">
      <div class="status-left">
        <span class="status-time" id="status-time">12:00</span>
      </div>
      <div class="status-right">
        <!-- 信号阶梯条 -->
        <span class="status-indicator">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="none">
            <rect x="0" y="8" width="2.5" height="3" rx="0.8" fill="#333"/>
            <rect x="4.5" y="5.5" width="2.5" height="5.5" rx="0.8" fill="#333"/>
            <rect x="9" y="3" width="2.5" height="8" rx="0.8" fill="#333"/>
            <rect x="13.5" y="0" width="2.5" height="11" rx="0.8" fill="#333"/>
          </svg>
        </span>
        <!-- WiFi 图标 -->
        <span class="status-indicator">
          <svg width="15" height="12" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.3" stroke-linecap="round">
            <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
            <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
            <line x1="12" y1="20" x2="12.01" y2="20"/>
          </svg>
        </span>
        <!-- 电池图标 -->
        <span class="status-indicator">
          <svg width="22" height="11" viewBox="0 0 24 12" fill="none" stroke="#333" stroke-width="1.8" rx="3">
            <rect x="1" y="1" width="19" height="10" rx="3"/>
            <path d="M22 4.5v3" stroke-linecap="round"/>
            <rect x="3" y="3" width="13" height="6" rx="1.5" fill="#333"/>
          </svg>
        </span>
      </div>
    </header>

    <!-- 主滑动视窗 (共两页) -->
    <main class="screens-slider" id="screens-slider">
      
      <!-- 第一页: 顶部小组件 P1 + 中部并排小组件 P2, P3 + 下方 6 个 APP -->
      <section class="screen-page" id="page-1">
        <div class="page-one-content">
          
          <div class="widgets-top-section">
            <!-- 顶部小组件 P1 挂载区 -->
            <div id="widget-p1-mount"></div>

            <!-- 顶部下方左右双列小组件 P2 和 P3 挂载区 -->
            <div class="widgets-mid-row">
              <div id="widget-p2-mount"></div>
              <div id="widget-p3-mount"></div>
            </div>
          </div>

          <!-- 第一页下方侧 6 个 APP: chat-记忆世界-相册-日记-世界书-老福特 -->
          <div class="page-apps-section">
            <div class="page-apps-grid" id="main-apps-grid"></div>
          </div>

        </div>
      </section>

      <!-- 第二页: APP 列表 (视频、恋人之家、闲鱼、美团、你懂得、查手机) -->
      <section class="screen-page" id="page-2">
        <div class="page-two-content">
          <div class="page-standard-grid" id="page-two-apps-grid"></div>
        </div>
      </section>

    </main>

    <!-- 底部两页分页指示器 -->
    <div class="page-dots">
      <span class="page-dot active"></span>
      <span class="page-dot"></span>
    </div>

    <!-- 底部 Dock 栏: 设置 - 美化 - 短信 - 频道 -->
    <nav class="dock-container" id="dock-mount"></nav>

  </div>

  <!-- 小组件自定义编辑抽屉 Modal (全透明遮罩 + 毛玻璃底部弹窗) -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">自定义组件</h3>
        <button class="modal-close-btn" id="modal-close-btn">✕</button>
      </div>
      <div id="modal-body-fields"></div>
      <button class="edit-save-btn" id="modal-save-btn">保存并更新到手机</button>
    </div>
  </div>

  <!-- 极简轻量提示 Toast -->
  <div class="toast-msg" id="toast"></div>

  <!-- 核心逻辑脚本 (区分文件单独管理) -->
  <script src="js/db.js"></script>
  <script src="js/apps.js"></script>
  <script src="js/widgets.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
