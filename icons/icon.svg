<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 背景渐变，契合项目的白灰 #F1F2F1 与 #D7D7D7 质感 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F2F1"/>
      <stop offset="100%" stop-color="#DCDDDC"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- 圆角背景 (iOS 规范连续曲率感) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="114" fill="none" stroke="#D7D7D7" stroke-width="2" />

  <!-- 顶部小爱心 / 星星装饰 -->
  <g transform="translate(256, 130) scale(1.1)">
    <path d="M 0, -10 C -12, -26 -32, -12 -18, 5 C -10, 15 0, 22 0, 22 C 0, 22 10, 15 18, 5 C 32, -12 12, -26 0, -10 Z" 
          fill="#111111" filter="url(#softShadow)"/>
    <!-- 小闪烁星 -->
    <path d="M 38 -20 Q 38 -10 48 -10 Q 38 -10 38 0 Q 38 -10 28 -10 Q 38 -10 38 -20 Z" fill="#444" />
    <path d="M -38 -25 Q -38 -18 -31 -18 Q -38 -18 -38 -11 Q -38 -18 -45 -18 Q -38 -18 -38 -25 Z" fill="#666" />
  </g>

  <!-- 两个火柴人（手牵手/相互依偎，黑白潮流极简线条） -->
  <g stroke="#111111" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#softShadow)">
    
    <!-- 左边火柴人 (祁祁 / 稍高一点带星标或帽子) -->
    <!-- 头部 -->
    <circle cx="185" cy="220" r="34" fill="#FFFFFF" stroke-width="14" />
    <!-- 身体 -->
    <path d="M 185 254 L 185 355" />
    <!-- 左手 (自然垂下) -->
    <path d="M 185 285 L 140 330" />
    <!-- 右手 (伸出与右边火柴人牵手) -->
    <path d="M 185 285 L 225 315 L 256 315" />
    <!-- 左腿 -->
    <path d="M 185 355 L 155 435" />
    <!-- 右腿 -->
    <path d="M 185 355 L 195 435" />

    <!-- 右边火柴人 (微偏头靠着左边，可爱温馨) -->
    <!-- 头部 -->
    <circle cx="325" cy="235" r="32" fill="#FFFFFF" stroke-width="14" />
    <!-- 身体 (微倾斜) -->
    <path d="M 325 267 L 320 358" />
    <!-- 左手 (伸出与左边牵手) -->
    <path d="M 325 292 L 285 315 L 256 315" />
    <!-- 右手 (开心微扬) -->
    <path d="M 325 292 L 368 335" />
    <!-- 左腿 -->
    <path d="M 320 358 L 305 435" />
    <!-- 右腿 -->
    <path d="M 320 358 L 345 435" />

  </g>

  <!-- 牵手中心的温馨小光点/小羁绊 -->
  <circle cx="256" cy="315" r="8" fill="#111111" />

  <!-- 底部精致字母小文字 -->
  <text x="256" y="475" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" letter-spacing="4" fill="#333333">QIQI PHONE</text>
</svg>